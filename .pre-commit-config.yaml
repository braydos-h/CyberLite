repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: repo-hygiene
        name: repository hygiene
        entry: python scripts/validate_repo.py
        language: system
        pass_filenames: false
