schema_version: 1
# Proposed source-registry additions from the Agent B source and licensing review.
#
# Every entry is disabled. A human must approve the license, the pinned
# revision, and the normalizer before any acquisition or training use.
# License identifiers follow data/sources.yaml conventions; some entries use a
# custom identifier because no SPDX identifier exists (DRL, IETF, Community
# Specification License, NIST public domain).
sources:
  windows_server_security:
    title: Windows Server security documentation (secured-core seed)
    kind: markdown
    license: CC-BY-4.0
    homepage: https://learn.microsoft.com/en-us/windows-server/security/security-and-assurance
    url: https://raw.githubusercontent.com/MicrosoftDocs/windowsserverdocs/b640f2cf0c08a765e9281dca814d7e3f379e5a52/WindowsServerDocs/security/configure-secured-core-server.md
    filename: windows-server-secured-core.md
    enabled: false
    redistributable: false
    revision: b640f2cf0c08a765e9281dca814d7e3f379e5a52
    license_url: https://github.com/MicrosoftDocs/windowsserverdocs/blob/b640f2cf0c08a765e9281dca814d7e3f379e5a52/LICENSE
    terms_url: https://learn.microsoft.com/en-us/legal/termsofuse
    attribution_required: true
    commercial_use: true
    allowed_uses: [training, research, commercial-use]
    redistribution_notes: >-
      The repository LICENSE grants CC BY 4.0, but the Microsoft Learn Terms of
      Use state personal, non-commercial use and no derivative works. Keep
      redistributable false until counsel resolves the conflict.
    unresolved:
      - Microsoft Learn Terms of Use may override the repository CC BY 4.0 grant for training and redistribution.
      - This entry covers Windows Server, not Windows client security.
      - The full repository archive is large; acquire only the curated security files.
    citation: >-
      Microsoft. Windows Server security documentation. Microsoft Learn.
      https://learn.microsoft.com/en-us/windows-server/security/security-and-assurance
    notes: >-
      License verified from the raw LICENSE file on 2026-11-25 (CC BY 4.0).
      Single-file seed; add further WindowsServerDocs/security files from the
      same commit through an explicit allowlist. Contamination risk: low
      lexical, possible conceptual overlap with Windows certification items.

