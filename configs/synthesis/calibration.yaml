schema_version: 1
# Calibration build: 500 accepted records used to measure rejection rates and
# recurring defects before scaling. Do not describe the calibration set as a
# production corpus.
name: synthesis-calibration
stage: calibration
packs: data/synthesis/knowledge
out: data/processed/synthesis-calibration
manifest_dir: data/manifests/synthesis-calibration
pilot_dir: data/processed/pilot-v2
include_pilot: false
evaluation_dir: data/evaluation
seed: 42
split_seed: 1337
split:
  train: 0.90
  validation: 0.05
  test: 0.05
tokenizer: Qwen/Qwen3.5-0.8B
tokenizer_local_only: true
max_sequence_tokens: 1024
dedup_threshold: 3
semantic_threshold: 0.88
contamination_n: 13
contamination_threshold: 0.20
