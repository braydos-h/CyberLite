# Offline distillation: train on teacher-generated data produced by
# scripts/generate_distillation_data.py and filtered by prepare_dataset.py.
schema_version: 1
run:
  name: cyberlite-distilled
  seed: 42
  output_dir: runs/distilled
  tags: [distillation, qlora]
  notes: Student training on reviewed teacher generations; not online logit KD.

model:
  id: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17
  require_pinned_revision: true
  # E3 uses the same student checkpoint as the matched E1/E2 conditions.
  matched_baseline: true
  dtype: bfloat16
  device: auto
  attn_implementation: sdpa
  trust_remote_code: false
  freeze_vision: true
  use_cache: false
  parameters_b: 0.853

quantization:
  load_in_4bit: true
  load_in_8bit: false
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto
  bias: none
  task_type: CAUSAL_LM

training:
  epochs: 1
  max_steps: -1
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_seq_length: 2048
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  bf16: true
  fp16: false
  tf32: true
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
  dataloader_num_workers: 0
  report_to: []
  resume_from_checkpoint: null
  smoke: false

data:
  # Teacher-generated student corpus. It must be produced and versioned before
  # training; this config intentionally has no fallback to the pilot dataset.
  train_file: data/processed/distill/train.jsonl
  validation_file: data/processed/distill/validation.jsonl
  test_file: data/processed/distill/test.jsonl
  manifest_file: data/processed/distill/manifest.json
  dataset_version: null
  expected_split_counts: {}
  require_manifest: true
  verify_integrity: true
  require_provenance: true
  require_validation: true
  require_contamination_screen: true
  format: auto
  system_prompt: >-
    You are CyberLite, a defensive cybersecurity assistant. Prefer verifiable,
    safe guidance. Never claim to have executed commands or accessed systems.
  chat_template_kwargs:
    enable_thinking: false
  max_train_samples: null
  max_eval_samples: 256
  require_license: true
  allowed_licenses:
    - Apache-2.0
    - MIT
    - BSD-2-Clause
    - BSD-3-Clause
    - CC-BY-4.0
    - CC-BY-SA-4.0
    - CC0-1.0
    - Public-Domain
    - Synthetic
    - MITRE-ATTACK
    - MITRE-CWE
    - GPL-1.0-or-later
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-or-later
    - IETF-Trust
    - Linux-man-pages-1-para
    - Linux-man-pages-copyleft
    - OpenSSH
  require_resolved_licenses: true
  allow_unresolved_licenses: []
  truncation_policy: truncate
  min_supervised_tokens: 1

distillation:
  enabled: true
  teacher_model_id: Qwen/Qwen3.5-4B
  teacher_revision: null
  prompts_file: data/seed/distill_prompts.jsonl
  output_file: data/processed/distill_raw.jsonl
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 768
  min_response_chars: 80
  max_samples: null

reporting:
  json_logs: false
  cost_per_gpu_hour_usd: null
  electricity_cost_per_kwh_usd: null
  hardware_watts: null
