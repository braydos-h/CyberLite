# 4 GB VRAM class: QLoRA with a short context window and conservative batch size.
# This is an experimental target, not a guaranteed fit. Measure with train.py.
schema_version: 1
run:
  name: cyberlite-low-vram-qlora
  seed: 42
  output_dir: runs/low-vram-qlora
  tags: [qlora, low-vram, 4gb]
  notes: Designed for a 4 GB target; expect allocator pressure and slow steps.

model:
  id: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17
  require_pinned_revision: true
  matched_baseline: true
  dtype: bfloat16
  device: auto
  attn_implementation: sdpa
  trust_remote_code: false
  freeze_vision: true
  use_cache: false
  parameters_b: 0.853

quantization:
  load_in_4bit: true
  load_in_8bit: false
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: auto
  bias: none
  task_type: CAUSAL_LM

training:
  epochs: 1
  max_steps: -1
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_seq_length: 512
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  bf16: true
  fp16: false
  tf32: true
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
  dataloader_num_workers: 0
  report_to: []
  resume_from_checkpoint: null
  smoke: false

data:
  train_file: data/processed/pilot-v2/train.jsonl
  validation_file: data/processed/pilot-v2/validation.jsonl
  test_file: data/processed/pilot-v2/test.jsonl
  manifest_file: data/manifests/pilot-v2/manifest.json
  dataset_version: cyberlite-data-2.0.0-04b01b437805
  expected_split_counts:
    train: 6351
    validation: 416
    test: 421
  require_manifest: true
  verify_integrity: true
  require_provenance: true
  require_validation: true
  require_contamination_screen: true
  format: auto
  system_prompt: >-
    You are CyberLite, a defensive cybersecurity assistant. Prefer verifiable,
    safe guidance. Never claim to have executed commands or accessed systems.
  chat_template_kwargs:
    enable_thinking: false
  max_train_samples: null
  max_eval_samples: 128
  require_license: true
  allowed_licenses:
    - Apache-2.0
    - MIT
    - BSD-2-Clause
    - BSD-3-Clause
    - CC-BY-4.0
    - CC-BY-SA-4.0
    - CC0-1.0
    - Public-Domain
    - Synthetic
    - MITRE-ATTACK
    - MITRE-CWE
    - GPL-1.0-or-later
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-or-later
    - IETF-Trust
    - Linux-man-pages-1-para
    - Linux-man-pages-copyleft
    - OpenSSH
  # pilot-v2 contains licenses with unresolved model-output questions. Leave
  # this empty until a human records a licensing decision; do not auto-approve.
  require_resolved_licenses: true
  allow_unresolved_licenses: []
  truncation_policy: truncate
  min_supervised_tokens: 1

distillation:
  enabled: false

reporting:
  json_logs: false
  cost_per_gpu_hour_usd: null
  electricity_cost_per_kwh_usd: null
  hardware_watts: null
